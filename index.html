<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Info</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>WEATHER APP ⛅</h1>
        <div class="input-group">
            <input type="text" id="type-loc" placeholder="Search location">
            <button id="search-btn">Search</button>
        </div>
        <div class="weather-card">
            <h2 id="city-name" class="weather-item">City</h2>
            <h2 id="temp" class="weather-item">Temperature</h2>
            <h2 id="feels-like" class="weather-item"> Feels Like</h2>
            <h2 id="condition" class="weather-item">Condition</h2>
            <h2 id="humidity" class="weather-item">Humidity</h2>
            <h2 id="pressure" class="weather-item">Pressure</h2>
            <h2 id="wind-speed" class="weather-item">Wind Speed</h2>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
